services:
  # Database schemas appearing is earlier than service migration completion.
  # Compose --wait must see HTTP readiness before application migrations begin.
  # Probes follow Supabase's official docker/docker-compose.yml.
  auth:
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s
  storage:
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/status"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s
  gateway:
    ports: !override
      - "127.0.0.1:8099:8099"
    volumes: !override
      - ../../.github/scripts/configured-ci-gateway.conf:/etc/nginx/conf.d/default.conf:ro
  checked-web:
    image: ${BRITELINK_CONFIGURED_CHECKED_IMAGE:?required}
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_started
    restart: "no"
