name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Read-only workflow: cancelling superseded runs is always safe here.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

# RUNNER CHOICE (#33). Hosted runners have never been assigned to this repository (account-level
# Actions limits; see docs/CI_RUNNER.md). Every job therefore reads its runner from the repository
# variable CI_RUNS_ON, a JSON value: unset means the hosted "ubuntu-24.04", and a self-hosted
# runner on a NON-production host is selected with e.g. ["self-hosted","linux","britelink-ci"].
# Switching is a variable change, not a code change, and switching back is deleting the variable.

jobs:
  build-test:
    name: build-test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ORDER IS LOAD-BEARING: tests/sites-worker.test.mjs fs.access()es
      # dist/client/index.html, dist/server/index.js and dist/.openai/hosting.json.
      # dist/ is gitignored, so `npm test` on a clean checkout fails without this.
      - name: Build
        run: npm run build

      # Provenance guard, kept before the tests so a provenance failure is reported as
      # provenance rather than as a confusing import error. Fails when a tracked test imports
      # a file git does not track -- the defect that shipped a broken main three times here.
      # A clean checkout is the only checkout where this check is meaningful, so CI is where
      # it belongs. See scripts/check-tracked-test-imports.mjs for the rationale.
      - name: Tests do not depend on untracked files
        run: node scripts/check-tracked-test-imports.mjs

      # The calendar-feed nginx route (tests/nginx-calendar-feed.test.mjs) runs in a real nginx.
      # Hosted images do not ship one; install it there and make the test refuse to skip.
      - name: Install nginx for the feed-route test (hosted runners)
        if: ${{ runner.environment == 'github-hosted' }}
        run: sudo apt-get update -q && sudo apt-get install -y -q nginx-core && echo "BRITELINK_REQUIRE_NGINX=1" >> "$GITHUB_ENV"

      - name: Unit and integration tests
        run: npm test
        timeout-minutes: 10

      - name: Record built client hash
        id: hashes
        run: |
          set -euo pipefail
          H=$(sha256sum dist/client/index.html | awk '{print $1}')
          echo "client_index_sha256=$H" >> "$GITHUB_OUTPUT"
          sha256sum dist/client/index.html dist/server/index.js dist/.openai/hosting.json
          echo "client index.html sha256: $H"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # v4 excludes dotfiles by default -> dist/.openai/hosting.json would be missing.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # supabase/migrations/*.sql target Supabase, so tests/security-schema.test.mjs can only
  # read them statically -- it proves structure, never that Postgres accepts the plpgsql.
  # This job closes that blind spot: it applies the shim, every migration in order, and the
  # storage policies to a throwaway Postgres, runs the behavioural assertions, then applies
  # supabase/seed/synthetic-staging.sql and verifies the result -- every id in the env block
  # it prints, the deletion fixture, the storage policies against real rows, and an
  # own-household sentinel for both administrators on all 25 private tables. It ends by
  # deleting one sentinel and requiring the verifier to fail, so the checks are known to be
  # discriminating rather than merely green.
  # It needs docker (present on ubuntu runners) and network for the postgres image pull.
  migration-harness:
    name: migration-harness
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Apply every migration and verify the retention executor
        run: bash scripts/migration-harness/validate-migrations.sh
        timeout-minutes: 10

  browser-audits:
    name: browser-audits
    needs: build-test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # playwright@1.62.1 has no install script, so npm ci never fetches browsers.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps needs sudo apt, which a self-hosted runner should not have; provision the OS
      # libraries on that host once instead (docs/CI_RUNNER.md).
      - name: Install Chromium and OS dependencies
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
        timeout-minutes: 15

      # Each audit spawns its own Vite dev server (127.0.0.1:4317..4322) with a
      # mocked harness under qa/. No network, no env vars, no dist/ dependency.
      # `!cancelled()` => one run reports all six results instead of stopping at the first.
      - name: Audit - accessibility
        if: ${{ !cancelled() }}
        run: npm run test:a11y
        timeout-minutes: 10

      - name: Audit - authenticated workspace
        if: ${{ !cancelled() }}
        run: npm run test:authenticated
        timeout-minutes: 10

      - name: Audit - staff workspace
        if: ${{ !cancelled() }}
        run: npm run test:staff
        timeout-minutes: 10

      - name: Audit - staff attachment recovery
        if: ${{ !cancelled() }}
        run: npm run test:staff-attachments
        timeout-minutes: 10

      - name: Audit - multi-household
        if: ${{ !cancelled() }}
        run: npm run test:households
        timeout-minutes: 10

      - name: Audit - beta signup
        if: ${{ !cancelled() }}
        run: npm run test:beta-signup
        timeout-minutes: 10

      # These paths are git-tracked and get overwritten here. Intentional and
      # harmless: nothing downstream reads them and no step commits them back.
      # Do NOT add a clean-working-tree assertion to this job.
      - name: Upload audit reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            qa/accessibility/report.json
            qa/accessibility/*.png
            qa/operations/*.json
            qa/print/*.pdf
            qa/operations/*.png
          if-no-files-found: ignore
          retention-days: 7

  checked-image-build:
    name: checked-image-build
    needs: [build-test, migration-harness, browser-audits]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify image transport tamper rejection
        run: |
          python3 .github/scripts/test_public_build_profile.py
          python3 .github/scripts/test_checked_image.py
      - name: Build an explicitly unconfigured demo image
        run: >-
          docker build --build-arg BRITELINK_BUILD_COMMIT="$RELEASE_SHA"
          --build-arg VITE_SUPABASE_URL= --build-arg VITE_SUPABASE_ANON_KEY=
          --build-arg VITE_PRIVACY_NOTICE_VERSION= --build-arg VITE_ATTACHMENTS_ENABLED=
          -t britelink:checked-candidate .
      - name: Export the exact saved runtime and source receipt
        run: python3 .github/scripts/checked-image.py export --image britelink:checked-candidate --directory "$RUNNER_TEMP/britelink-checked-image"
      - uses: actions/upload-artifact@v4
        with:
          name: britelink-demo-checked-image-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/britelink-checked-image/
          if-no-files-found: error
          retention-days: 7
  checked-image-runtime:
    name: checked-image-runtime
    needs: checked-image-build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for the saved-image browser audit
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - uses: actions/download-artifact@v4
        with:
          name: britelink-demo-checked-image-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/britelink-checked-image/
      - name: Verify and load the saved runtime without rebuilding
        run: python3 .github/scripts/checked-image.py load --directory "$RUNNER_TEMP/britelink-checked-image"
      - name: Audit the actual saved demo runtime and restart
        run: bash .github/scripts/test-checked-runtime.sh
      - name: Preserve the saved-image browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: britelink-demo-image-browser-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: qa/accessibility/
          if-no-files-found: error
          retention-days: 7

  configured-image-build:
    name: configured-image-build
    needs: [build-test, migration-harness, browser-audits]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.sha }}
      BRITELINK_CHECKED_BUILD_MODE: qa-configured
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify disposable fixture and transport guards
        run: |
          node --test .github/scripts/test_configured_qa_env.mjs
          python3 .github/scripts/test_checked_image.py
      - name: Build image with isolated CI public configuration
        run: node .github/scripts/build-configured-image.mjs
      - name: Export exact configured runtime and receipt
        run: python3 .github/scripts/checked-image.py export --image britelink:configured-candidate --directory "$RUNNER_TEMP/britelink-configured-image"
      - uses: actions/upload-artifact@v4
        with:
          name: britelink-configured-checked-image-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/britelink-configured-image/
          if-no-files-found: error
          retention-days: 7

  configured-image-runtime:
    name: configured-image-runtime
    needs: configured-image-build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.sha }}
      BRITELINK_CHECKED_BUILD_MODE: qa-configured
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for genuine authenticated journeys
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: Prove journey transport denies outside requests and redirects
        run: node --test .github/scripts/test_journey_network.mjs
      - uses: actions/download-artifact@v4
        with:
          name: britelink-configured-checked-image-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/britelink-configured-image/
      - name: Verify and load saved configured image without rebuilding
        run: python3 .github/scripts/checked-image.py load --directory "$RUNNER_TEMP/britelink-configured-image"
      - name: Test saved image with real isolated Supabase and synthetic households
        run: bash .github/scripts/test-configured-runtime.sh
      - name: Preserve only sanitized configured-image proof
        uses: actions/upload-artifact@v4
        with:
          name: britelink-configured-image-proof-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .verification/britelink-configured-image.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
