name: Ops check

# Production diagnostics over the deploy SSH path, running scripts/ops-check.sh from the dispatched
# commit. "check" (default) is read-only and prints facts only, never a key or secret: whether the
# web build's anon key verifies under the secret PostgREST uses, and whether Traefik writes an
# access log. "fix-anon-key" copies the production stack's own ANON_KEY into the web .env after a
# backup; run Deploy afterwards so the bundle is rebuilt with it. "reconcile-stack" recreates the
# production stack's auth/rest/storage containers from its own compose files and .env (db untouched)
# so every service uses the JWT_SECRET that signed ANON_KEY; it signs out existing sessions.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read-only), feed-route, restore-secret, reconcile-stack, or fix-anon-key"
        required: true
        default: check
        type: choice
        options: [check, set-notice-version, feed-route, restore-secret, reconcile-stack, fix-anon-key]
      value:
        description: "set-notice-version only: the counsel-approved privacy notice version (e.g. 2026-09-30)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-britelink-web
  cancel-in-progress: false

env:
  VPS_HOST: 187.77.26.99
  VPS_USER: root

jobs:
  ops:
    name: ops (${{ inputs.mode }})
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - name: Install SSH key and pin host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/britelink_deploy"
          chmod 600 "$HOME/.ssh/britelink_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Run scripts/ops-check.sh on the VPS
        env:
          MODE: ${{ inputs.mode }}
          VALUE: ${{ inputs.value }}
          OPS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$MODE" in check|fix-anon-key|reconcile-stack|restore-secret|feed-route|set-notice-version) ;; *) echo "::error::bad mode"; exit 1 ;; esac
          # Only a plain token may cross into the remote command line.
          if [ -n "$VALUE" ] && ! printf '%s' "$VALUE" | grep -Eq '^[A-Za-z0-9._-]{1,80}$'; then
            echo "::error::value may only contain letters, digits, dot, dash and underscore (1-80)"; exit 1
          fi
          ssh -i "$HOME/.ssh/britelink_deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 "${VPS_USER}@${VPS_HOST}" "bash -s -- '$MODE' '$OPS_SHA' '$VALUE'" <<'REMOTE'
          set -euo pipefail
          MODE="$1"; SHA="$2"; VALUE="${3:-}"
          work="$(mktemp -d /root/bl-ops.XXXXXX)"
          trap 'rm -rf "$work"' EXIT
          cd /docker/britelink-web
          git fetch --depth=1 origin "$SHA"
          git archive "$SHA" scripts/ops-check.sh | tar -x -C "$work"
          bash "$work/scripts/ops-check.sh" "$MODE" "$VALUE"
          REMOTE

      - name: Remove the deploy key from the runner
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/britelink_deploy" "$HOME/.ssh/known_hosts"
