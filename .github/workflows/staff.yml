name: Staff

# Adds, removes or lists BriteLink staff (migration 060, issue #100) by running
# scripts/staff-team.sh from the commit on main, over the same SSH path as Backup. Admins are added
# to every family's household; educators join a family when an admin assigns them its case
# (migration 061). See docs/STAFF_TEAM.md.
#
# The repository is public, so this run's log is too: the email is masked in the first step,
# before any step's env could print it, and the script prints only masked addresses.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "list, add or remove"
        required: true
        type: choice
        options: [list, add, remove]
      email:
        description: "add/remove: the person's sign-in email (they need a BriteLink account first)"
        required: false
      role:
        description: "add only: educator or admin"
        required: false
        type: choice
        options: [educator, admin]
      case_limit:
        description: "add only, educators: most active cases at once (0-100)"
        required: false
        default: "10"

permissions:
  contents: read

env:
  VPS_HOST: 187.77.26.99
  VPS_USER: root

jobs:
  approve:
    name: approve (production change)
    # "list" only reads, so it never waits. Anything else changes production, so it waits here
    # for a required reviewer on the production-change environment, and refuses to run while
    # that environment has none (docs/APPLYING_MIGRATIONS.md -> "Approving a production change").
    if: ${{ github.ref == 'refs/heads/main' && inputs.action != 'list' }}
    environment: production-change
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require a reviewer on production-change
        env:
          GH_TOKEN: ${{ github.token }}
        # Only curl and grep, so it runs on any configured runner (the self-hosted fallback has no gh
        # or jq). "required_reviewers" appears in the response only as a protection rule's type.
        run: |
          set -euo pipefail
          if ! rules="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/production-change")"; then
            echo "::error::Could not read the production-change environment's rules from GitHub, so this run cannot show that anyone approved it. Nothing changed."
            exit 1
          fi
          n="$({ grep -Eo '"type"[[:space:]]*:[[:space:]]*"required_reviewers"' <<<"$rules" || true; } | wc -l)"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::Nobody approved this production change: the production-change environment has no required reviewer. Add one under Settings -> Environments -> production-change -> Required reviewers, then run this again. Nothing changed."
            exit 1
          fi
          echo "A required reviewer approved this run."

  staff:
    name: staff (${{ inputs.action }})
    needs: approve
    # Runs after an approval, or straight away for the read-only mode (the gate is skipped then).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.approve.result == 'success' || (inputs.action == 'list' && needs.approve.result == 'skipped')) }}
    # Job-level, so a run waiting for approval never holds the queue. Staff changes run one at a time.
    concurrency:
      group: staff-britelink
      cancel-in-progress: false
    environment: production
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - name: Check the inputs
        # The email is read from the event file, not passed as env: GitHub prints a step's env in
        # the log before the step runs, which is before ::add-mask:: could hide it. Once masked
        # here, the later steps' env shows it as ***.
        env:
          ACTION: ${{ inputs.action }}
          CASE_LIMIT: ${{ inputs.case_limit }}
        run: |
          set -euo pipefail
          EMAIL="$(jq -r '.inputs.email // ""' "$GITHUB_EVENT_PATH")"
          if [ -n "$EMAIL" ]; then echo "::add-mask::$EMAIL"; fi
          if [ "$ACTION" != list ]; then
            [[ "$EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo "FAIL: enter the person's email address" >&2; exit 1; }
          fi
          [[ "$CASE_LIMIT" =~ ^[0-9]+$ ]] && [ "$CASE_LIMIT" -le 100 ] || { echo "FAIL: case limit must be 0-100" >&2; exit 1; }

      - name: Install SSH key and pin host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/britelink_deploy"
          chmod 600 "$HOME/.ssh/britelink_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Run on the VPS
        env:
          OPS_SHA: ${{ github.sha }}
          ACTION: ${{ inputs.action }}
          EMAIL: ${{ inputs.email }}
          ROLE: ${{ inputs.role }}
          CASE_LIMIT: ${{ inputs.case_limit }}
        run: |
          set -euo pipefail
          # Each argument goes inside single quotes on the remote command line, so each is checked
          # here, right before use: the email can hold no quote or space, the rest are fixed words.
          if [ "$ACTION" = list ]; then EMAIL=""; else
            [[ "$EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || exit 1
          fi
          [[ "$ACTION" =~ ^(list|add|remove)$ ]] && [[ "$ROLE" =~ ^(educator|admin)?$ ]] && [[ "$CASE_LIMIT" =~ ^[0-9]{1,3}$ ]] || exit 1
          ssh -i "$HOME/.ssh/britelink_deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 -o ServerAliveInterval=30 "${VPS_USER}@${VPS_HOST}" \
              "bash -s -- '$OPS_SHA' '$ACTION' '$EMAIL' '$ROLE' '$CASE_LIMIT'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"; ACTION="$2"; EMAIL="$3"; ROLE="$4"; CASE_LIMIT="$5"
          work="$(mktemp -d /root/bl-staff.XXXXXX)"
          trap 'rm -rf "$work"' EXIT
          cd /docker/britelink-web
          git fetch --depth=1 origin "$SHA"
          git archive "$SHA" scripts/staff-team.sh | tar -x -C "$work"
          case "$ACTION" in
            list) bash "$work/scripts/staff-team.sh" list ;;
            add) bash "$work/scripts/staff-team.sh" add "$EMAIL" "$ROLE" "$CASE_LIMIT" ;;
            remove) bash "$work/scripts/staff-team.sh" remove "$EMAIL" ;;
          esac
          REMOTE

      - name: Remove the deploy key from the runner
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/britelink_deploy" "$HOME/.ssh/known_hosts"
