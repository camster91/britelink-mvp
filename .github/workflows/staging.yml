name: Staging

# VPS staging (synthetic data only) over the deploy SSH path, running scripts/staging-ops.sh from the
# dispatched commit. "rebuild" wipes and rebuilds the staging stack (needed once: it predates
# migration 038); "verify" builds a staging copy of the app and runs the hosted isolation verifier
# (D1 + D2) and the parent + educator journeys against it. Never touches production: the script
# refuses any target that is not a staging compose project.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify, rebuild, or rebuild-and-verify"
        required: true
        default: verify
        type: choice
        options: [verify, rebuild, rebuild-and-verify]

permissions:
  contents: read

# Its own queue: a long staging rebuild must never cancel a waiting Migrate or Ops check run
# (GitHub keeps one pending run per group). Staging only touches the staging stack.
concurrency:
  group: staging-britelink
  cancel-in-progress: false

env:
  VPS_HOST: 187.77.26.99
  VPS_USER: root

jobs:
  approve:
    name: approve (production change)
    # "verify" only uses synthetic data, so it never waits. A rebuild wipes the staging stack, which
    # needs the owner's go (AGENT_HANDOFF.md), so it waits for a required reviewer on the
    # production-change environment (docs/APPLYING_MIGRATIONS.md -> "Approving a production change").
    if: ${{ github.ref == 'refs/heads/main' && inputs.mode != 'verify' }}
    environment: production-change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require a reviewer on production-change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! n="$(gh api "repos/$GITHUB_REPOSITORY/environments/production-change" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')"; then
            echo "::error::Could not read the production-change environment's rules from GitHub, so this run cannot show that anyone approved it. Nothing changed."
            exit 1
          fi
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::Nobody approved this production change: the production-change environment has no required reviewer. Add one under Settings -> Environments -> production-change -> Required reviewers, then run this again. Nothing changed."
            exit 1
          fi
          echo "A required reviewer approved this run."

  staging:
    name: staging (${{ inputs.mode }})
    needs: approve
    # Runs after an approval, or straight away for "verify" (the gate is skipped then).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.approve.result == 'success' || (inputs.mode == 'verify' && needs.approve.result == 'skipped')) }}
    environment: production
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 40
    steps:
      - name: Install SSH key and pin host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/britelink_deploy"
          chmod 600 "$HOME/.ssh/britelink_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Run scripts/staging-ops.sh on the VPS
        env:
          MODE: ${{ inputs.mode }}
          OPS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$MODE" in verify|rebuild|rebuild-and-verify) ;; *) echo "::error::bad mode"; exit 1 ;; esac
          ssh -i "$HOME/.ssh/britelink_deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 -o ServerAliveInterval=30 \
              "${VPS_USER}@${VPS_HOST}" "bash -s -- '$MODE' '$OPS_SHA'" <<'REMOTE'
          set -euo pipefail
          MODE="$1"; SHA="$2"; export SHA
          work="$(mktemp -d /root/bl-staging-src.XXXXXX)"
          trap 'rm -rf "$work"' EXIT
          cd /docker/britelink-web
          git fetch --depth=1 origin "$SHA"
          git archive "$SHA" | tar -x -C "$work"
          case "$MODE" in
            rebuild) bash "$work/scripts/staging-ops.sh" rebuild ;;
            verify) bash "$work/scripts/staging-ops.sh" verify ;;
            rebuild-and-verify) bash "$work/scripts/staging-ops.sh" rebuild && bash "$work/scripts/staging-ops.sh" verify ;;
          esac
          REMOTE

      - name: Remove the deploy key from the runner
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/britelink_deploy" "$HOME/.ssh/known_hosts"
