name: Backup

# Nightly production database backup with a restore check (#8), over the deploy SSH path. Runs
# scripts/backup-production.sh from the commit on main: pg_dump to /root/britelink-backups on the
# VPS, restore into a throwaway container of the same image, require identical row counts, keep
# the newest 14. Then an encrypted copy of that verified dump goes to the owner's Google Drive (once
# its two secrets are set). A failed run makes GitHub email the repository owner.
on:
  schedule:
    - cron: "43 7 * * *" # 07:43 UTC, ~03:43 Toronto
  workflow_dispatch:

permissions:
  contents: read

# Its own queue. GitHub keeps only ONE pending run per concurrency group and silently cancels the
# older one, so sharing deploy-britelink-web let a deploy, migrate, ops check or staging run that
# was queued at the same time drop tonight's backup (or the backup drop them) with no alert.
# Running alongside those is safe: this script only reads production and restores into its own
# throwaway container.
concurrency:
  group: backup-britelink
  cancel-in-progress: false

env:
  VPS_HOST: 187.77.26.99
  VPS_USER: root

jobs:
  backup:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - name: Install SSH key and pin host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/britelink_deploy"
          chmod 600 "$HOME/.ssh/britelink_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Back up and verify on the VPS
        env:
          OPS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/britelink_deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 -o ServerAliveInterval=30 "${VPS_USER}@${VPS_HOST}" "bash -s -- '$OPS_SHA'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          work="$(mktemp -d /root/bl-backup.XXXXXX)"
          trap 'rm -rf "$work"' EXIT
          cd /docker/britelink-web
          git fetch --depth=1 origin "$SHA"
          git archive "$SHA" scripts/backup-production.sh | tar -x -C "$work"
          bash "$work/scripts/backup-production.sh"
          REMOTE

      # Off-site copy (#8): the newest verified dump, encrypted, to the owner's Google Drive. Until
      # both secrets exist this step fails, so the run is red and emails the owner every night (owner
      # decision 2026-10-21: a backup with no off-site copy must not look green). The verified dump
      # on the VPS is already safe by then. A failed copy fails the run too. The dump streams from the VPS straight into gpg, so the unencrypted data
      # is never written to the runner's disk. Setup and restore: docs/RECOVERY_OPERATIONS.md.
      - name: Copy the verified backup to Google Drive (encrypted)
        env:
          RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          DRIVE_FOLDER: BriteLink backups
          KEEP_DAYS: "30"
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONF" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::No off-site copy: GDRIVE_RCLONE_CONFIG and BACKUP_ENCRYPTION_PASSPHRASE are not both set. Tonight's verified backup is on the VPS only. Set them up with docs/RECOVERY_OPERATIONS.md -> \"Off-site copy in Google Drive\"."
            exit 1
          fi
          [ "${#PASSPHRASE}" -ge 20 ] || { echo "FAIL: BACKUP_ENCRYPTION_PASSPHRASE must be at least 20 characters" >&2; exit 1; }
          command -v rclone >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq rclone >/dev/null; }
          work="$(mktemp -d)"; chmod 700 "$work"
          trap 'rm -rf "$work"' EXIT
          ( umask 077; printf '%s\n' "$RCLONE_CONF" > "$work/rclone.conf"; printf '%s' "$PASSPHRASE" > "$work/passphrase" )
          export RCLONE_CONFIG="$work/rclone.conf"
          # A throwaway keyring: nothing from this run outlives it.
          export GNUPGHOME="$work/gnupg"; install -d -m 700 "$GNUPGHOME"
          rclone listremotes | grep -qx 'gdrive:' || { echo "FAIL: GDRIVE_RCLONE_CONFIG has no remote named gdrive" >&2; exit 1; }
          vps() { ssh -i "$HOME/.ssh/britelink_deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 -o ServerAliveInterval=30 "${VPS_USER}@${VPS_HOST}" "$@"; }
          name="$(vps 'ls -1t /root/britelink-backups/nightly-*.dump 2>/dev/null | head -n 1 | xargs -r basename')"
          [[ "$name" =~ ^nightly-[0-9]{8}T[0-9]{6}Z\.dump$ ]] || { echo "FAIL: no verified nightly dump on the VPS" >&2; exit 1; }
          vps "cat '/root/britelink-backups/$name'" \
            | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-file "$work/passphrase" \
                  --symmetric --cipher-algo AES256 --output "$work/$name.gpg"
          [ -s "$work/$name.gpg" ] || { echo "FAIL: the encrypted copy is empty" >&2; exit 1; }
          rclone copyto "$work/$name.gpg" "gdrive:$DRIVE_FOLDER/$name.gpg"
          local_size="$(stat -c %s "$work/$name.gpg")"
          remote_size="$(rclone size --json "gdrive:$DRIVE_FOLDER/$name.gpg" | python3 -c 'import json,sys; print(json.load(sys.stdin)["bytes"])')"
          [ "$local_size" = "$remote_size" ] || { echo "FAIL: Drive holds $remote_size bytes, expected $local_size" >&2; exit 1; }
          echo "  ok   $name.gpg ($local_size bytes) in Google Drive folder \"$DRIVE_FOLDER\""
          # Prove the off-site copy can actually be restored from: read it back, decrypt it with the
          # same passphrase, and compare it byte for byte (by SHA-256) with the verified dump.
          source_sha="$(vps "sha256sum '/root/britelink-backups/$name'" | cut -d' ' -f1)"
          offsite_sha="$(rclone cat "gdrive:$DRIVE_FOLDER/$name.gpg" \
            | gpg --batch --quiet --pinentry-mode loopback --passphrase-file "$work/passphrase" --decrypt \
            | sha256sum | cut -d' ' -f1)"
          [[ "$source_sha" =~ ^[0-9a-f]{64}$ ]] && [ "$source_sha" = "$offsite_sha" ] \
            || { echo "FAIL: the Drive copy does not decrypt to the verified dump" >&2; exit 1; }
          echo "  ok   the Drive copy decrypts to the verified dump (SHA-256 match)"
          # Retention: only this job's own files (nightly-*.dump.gpg) older than KEEP_DAYS.
          rclone delete --min-age "${KEEP_DAYS}d" --include 'nightly-*.dump.gpg' "gdrive:$DRIVE_FOLDER"
          echo "  ok   $(rclone lsf --include 'nightly-*.dump.gpg' "gdrive:$DRIVE_FOLDER" | wc -l) encrypted copies kept off-site (newest ${KEEP_DAYS} days)"

      - name: Remove the deploy key from the runner
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/britelink_deploy" "$HOME/.ssh/known_hosts"
