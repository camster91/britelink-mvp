# Gateway for the self-hosted staging stack: one origin, three path prefixes.
#
# The shape is not a preference. The browser client and src/hosted-isolation.js both address a
# single Supabase origin with /auth/v1, /rest/v1 and /storage/v1 as paths, so the three services
# have to be joined behind one listener. nginx rather than Kong because there is no plugin
# surface needed here and a location block is easier to audit.
#
# Each proxy_pass names its upstream through a VARIABLE on purpose. nginx resolves a literal
# upstream hostname exactly once, at startup, and refuses to start at all if it does not resolve:
#
#     [emerg] host not found in upstream "auth" in /etc/nginx/conf.d/default.conf:32
#
# That is not a rare race here. Docker's embedded DNS only answers for *running* containers, and
# during a service's first boot it is repeatedly restarting, so "auth" really is absent from DNS at
# the instant nginx starts -- and the gateway joins the very restart loop it exists to sit in front
# of. A variable defers resolution to request time, so nginx stays up and starts routing as soon as
# the upstream appears.
#
# The rewrite is what strips the path prefix, and it is the part that is easy to get wrong. A
# literal proxy_pass with a trailing slash (http://rest:3000/) strips the location prefix for you,
# so /rest/v1/households reaches PostgREST as /households. A variable carries no URI part, so that
# implicit strip disappears and has to be done explicitly -- without the rewrite, PostgREST, GoTrue
# and storage-api, which all serve from their root, receive /rest/v1/households and 404 it.
#
# The `set` MUST come BEFORE the `rewrite`. Both are directives of ngx_http_rewrite_module, and
# `rewrite ... break` completes processing of the current set of rewrite directives -- so a `set`
# written after it is never executed, the variable stays uninitialized, and proxy_pass fails:
#
#     [warn] 22#22: *1 using uninitialized "upstream_storage" variable
#     [error] 22#22: *1 invalid URL prefix in ""
#
# which surfaces to the client as a bare nginx 500. `last` is not a substitute for `break` here: it
# restarts location matching against the stripped URI, which matches no location and 404s instead.

# Sign-in emails. GoTrue's email budget (GOTRUE_RATE_LIMIT_EMAIL_SENT) is one per-hour count for the
# whole site, so with sign-up open a single script sending links to made-up addresses could spend
# it and leave every family and staff member unable to sign in. Each client address gets a few
# sends a minute here first. A parent pressing "send again" stays well inside it.
limit_req_zone $binary_remote_addr zone=auth_email:1m rate=6r/m;

server {
    listen 8000;
    server_name _;

    # The gateway is only reachable through the host's loopback port behind Traefik (production) or
    # the Docker network, both private addresses. Take the client address the proxy reports, so the
    # limit above (and GoTrue's own per-address limits, via X-Real-IP) count real visitors rather
    # than the proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's embedded DNS resolver. Required for any proxy_pass that uses a variable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The case-attachments bucket is created with a 10 MB file-size limit. This has to be a
    # little above it or an oversized upload is rejected by nginx with an HTML error page instead
    # of the JSON the client and the verifier both expect to parse.
    client_max_body_size 20m;

    # Nothing here is a public website; keep the surface minimal.
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location /auth/v1/ {
        set $upstream_auth http://auth:9999;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $upstream_auth;
    }

    # The routes that send an email. A regex location wins over the /auth/v1/ prefix above.
    location ~ ^/auth/v1/(otp|magiclink|signup|recover|resend)$ {
        limit_req zone=auth_email burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_email_limited;
        set $upstream_auth http://auth:9999;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $upstream_auth;
    }

    # GoTrue's own error shape, so the app shows this sentence rather than an nginx page.
    location @auth_email_limited {
        default_type application/json;
        return 429 '{"code":429,"error_code":"over_request_rate_limit","msg":"Too many sign-in emails were asked for from this network. Wait a minute, then try again."}';
    }

    # GoTrue emails its magic link as ${API_EXTERNAL_URL}/verify -- WITHOUT the /auth/v1
    # prefix that every other route uses. Without this block the link a guardian receives
    # resolves to nginx's 404 page, so the emailed link can never sign anyone in. Proxying
    # the bare path is the fix that matches GoTrue as it actually behaves; rewriting the
    # URL GoTrue generates would fight the mailer's own template.
    location = /verify {
        set $upstream_auth http://auth:9999;
        proxy_pass $upstream_auth;
    }

    location /rest/v1/ {
        set $upstream_rest http://rest:3000;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass $upstream_rest;
    }

    location /storage/v1/ {
        set $upstream_storage http://storage:5000;
        rewrite ^/storage/v1/(.*)$ /$1 break;
        proxy_pass $upstream_storage;
    }

    # A bare / is not a route. Answering it explicitly means a misconfigured base URL shows up as
    # a clear 404 here rather than as an nginx default page that looks like a network problem.
    location = / {
        return 404 '{"message":"self-hosted staging gateway: use /auth/v1, /rest/v1 or /storage/v1"}';
    }
}
